# docker-compose.yml
version: "3.9"
services:
  api:
    build: .
    container_name: interview-coach-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: interview-coach-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: interview_coach
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: